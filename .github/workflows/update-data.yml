name: Uppdatera dashboarddata

on:
  schedule:
    - cron: '10 * * * *'   # Varje timme vid :10
  workflow_dispatch:        # Kan även köras manuellt

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Hämta data
        run: python3 scripts/fetch_data.py

      - name: Commit och pusha om data ändrades
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "Ingen förändring i data, inget commit."
          else
            git commit -m "data: uppdatera $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
