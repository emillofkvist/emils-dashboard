name: Debug fetch menu sources
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch sources
        run: |
          mkdir -p debug
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36"
          set +e
          fetch() {
            url="$1"; out="$2"; shift 2
            code=$(curl -sSL --max-time 20 -A "$UA" "$@" "$url" -o "debug/$out" -w "%{http_code}" 2>"debug/$out.err")
            size=$(wc -c < "debug/$out" 2>/dev/null || echo 0)
            echo "$out: HTTP $code, $size bytes ($url)" >> debug/SUMMARY.txt
          }
          : > debug/SUMMARY.txt

          # 1) HA community thread (recent breakage report)
          fetch "https://community.home-assistant.io/t/anyone-got-skolmaten-se-api-working-since-then-change/849641.json" ha-thread.json

          # 2) astorp.se via a currently-working proxy (cors.eu.org) run from Actions network
          fetch "https://cors.eu.org/https://astorp.se/barn-och-utbildning/grundskola/hyllinge-skola.html" astorp-via-corseu.html
          # astorp.se retry direct, shorter timeout, plain http
          fetch "http://astorp.se/barn-och-utbildning/grundskola/hyllinge-skola.html" astorp-http.html

          # 3) skolmaten.se root school page (SPA) - look for preloaded JSON/school id
          fetch "https://skolmaten.se/hyllinge-skola" skolmaten-root.html
          fetch "https://skolmaten.se/hyllinge-skola/" skolmaten-root-slash.html

          # 4) skolmaten sitemap / robots for slug hints
          fetch "https://skolmaten.se/sitemap.xml" skolmaten-sitemap.xml
          fetch "https://skolmaten.se/robots.txt" skolmaten-robots.txt

          # 5) try v3 API (pre-v4) as last resort, and sok.json style search
          fetch "https://skolmaten.se/api/4/schools?name=hyllinge" skolmaten-search3.json -H "client-token: web-eaa12e50-c84c-4b4a-9cfe-4e3fcbcd9165"
          fetch "https://skolmaten.se/api/3/schools?district=&name=hyllinge" skolmaten-v3.json

          cat debug/SUMMARY.txt
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B debug-fetch
          git add -f debug
          git commit -m "Debug fetch results round 3"
          git push -f origin debug-fetch
